name: PRISM usability research kit checks
on:
  push:
    paths:
      - 'analysis/**'
      - 'tests/**'
      - '.github/workflows/usability-kit-checks.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'tests/**'
      - '.github/workflows/usability-kit-checks.yml'
jobs:
  validate-sus-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fictional regression checks
        run: python3 -m unittest discover -s tests -v
